services:
  - type: web
    name: barberpro-api
    env: python
    region: frankfurt
    plan: free # Change to starter/standard for production
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    # To persist SQLite directly on Render (requires Starter plan):
    # disk:
    #   name: barberpro-data
    #   mountPath: /var/data
    #   sizeGB: 1
    envVars:
      - key: SUPERADMIN_LOGIN
        value: superadmin
      - key: SUPERADMIN_PASSWORD
        value: super123
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      # Persistent data directory (auto-detects /var/data if mounted)
      - key: DATA_DIR
        value: /var/data
      # Or connect a free persistent PostgreSQL (Neon, Supabase, etc.):
      # - key: MASTER_DATABASE_URL
      #   sync: false
        
  - type: web
    name: barberpro-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: barberpro-api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
